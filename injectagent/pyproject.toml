[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iterinject"
version = "0.1.0"
description = "IterInject inner loop, bounded seed search, and InjecAgent research adapter"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["openai>=1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
iterinject = "iterinject.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "LICENSES/injecagent-MIT.txt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iterinject.prompts" = ["*.txt"]
"iterinject.adapters.injecagent" = ["*.txt", "*.json"]
"iterinject.assets" = ["manifest.json", "strategies/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"
